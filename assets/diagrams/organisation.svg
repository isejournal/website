<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1250" viewBox="0 0 2400 1250"><rect x="0" y="0" width="2400.0" height="1250.0" fill="#F6F2EA"/><text x="120.0" y="110.0" font-family="Libre Baskerville" font-size="22" font-weight="400" text-anchor="start" letter-spacing="4" fill="#7B633D">HOW THE JOURNAL IS ORGANISED</text><text x="120.0" y="165.0" font-family="Libre Baskerville" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1B2A4A">Governance, management, three working lines</text><text x="120.0" y="320.0" font-family="Libre Baskerville" font-size="18" font-weight="400" text-anchor="start" letter-spacing="3" fill="#7B633D">GOVERNANCE</text><text x="120.0" y="540.0" font-family="Libre Baskerville" font-size="18" font-weight="400" text-anchor="start" letter-spacing="3" fill="#7B633D">MANAGEMENT</text><text x="120.0" y="760.0" font-family="Libre Baskerville" font-size="18" font-weight="400" text-anchor="start" letter-spacing="3" fill="#7B633D">OPERATIONS</text><rect x="900" y="250" width="600" height="120" fill="none" stroke="#1B2A4A" stroke-width="1.6"/><text x="1200.0" y="306.0" font-family="Libre Baskerville" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="0" fill="#1B2A4A">The Board</text><text x="1200.0" y="338.0" font-family="Libre Baskerville" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#1B2A4A">18 votes · meets three times a year</text><rect x="900" y="470" width="600" height="120" fill="none" stroke="#1B2A4A" stroke-width="1.6"/><text x="1200.0" y="526.0" font-family="Libre Baskerville" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="0" fill="#1B2A4A">The Executive</text><text x="1200.0" y="558.0" font-family="Libre Baskerville" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#1B2A4A">Chief Editor, three Deputies, Operations</text><line x1="1200" y1="370" x2="1200" y2="470" stroke="#1B2A4A" stroke-width="1.6"/><path d="M1200 590 V650 M720 650 H1980" stroke="#1B2A4A" stroke-width="1.6" fill="none"/><line x1="720" y1="650" x2="720" y2="690" stroke="#1B2A4A" stroke-width="1.6"/><rect x="420" y="690" width="600" height="130" fill="none" stroke="#1B2A4A" stroke-width="1.6"/><text x="720.0" y="751.0" font-family="Libre Baskerville" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="0" fill="#1B2A4A">Editorial line</text><text x="720.0" y="783.0" font-family="Libre Baskerville" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#1B2A4A">Deputies · Section Heads · Junior Editors</text><line x1="720" y1="820" x2="720" y2="900" stroke="#1B2A4A" stroke-width="1.6" stroke-dasharray="8 6"/><rect x="480" y="900" width="480" height="120" fill="none" stroke="#1B2A4A" stroke-width="1.6" stroke-dasharray="8 6"/><text x="720.0" y="956.0" font-family="Libre Baskerville" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="0" fill="#1B2A4A">Referee pool</text><text x="720.0" y="988.0" font-family="Libre Baskerville" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#1B2A4A">doctoral students, ECRs, faculty</text><line x1="1350" y1="650" x2="1350" y2="690" stroke="#1B2A4A" stroke-width="1.6"/><rect x="1050" y="690" width="600" height="130" fill="none" stroke="#1B2A4A" stroke-width="1.6"/><text x="1350.0" y="751.0" font-family="Libre Baskerville" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="0" fill="#1B2A4A">Administrative line</text><text x="1350.0" y="783.0" font-family="Libre Baskerville" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#1B2A4A">Operations · Production · Communications</text><line x1="1980" y1="650" x2="1980" y2="690" stroke="#1B2A4A" stroke-width="1.6"/><rect x="1680" y="690" width="600" height="130" fill="none" stroke="#1B2A4A" stroke-width="1.6"/><text x="1980.0" y="751.0" font-family="Libre Baskerville" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="0" fill="#1B2A4A">External line</text><text x="1980.0" y="783.0" font-family="Libre Baskerville" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#1B2A4A">Partnerships · Faculty Relations · Sponsorship · Treasurer</text><line x1="1980" y1="820" x2="1980" y2="900" stroke="#1B2A4A" stroke-width="1.6" stroke-dasharray="8 6"/><rect x="1740" y="900" width="480" height="120" fill="none" stroke="#1B2A4A" stroke-width="1.6" stroke-dasharray="8 6"/><text x="1980.0" y="956.0" font-family="Libre Baskerville" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="0" fill="#1B2A4A">Advisory Board</text><text x="1980.0" y="988.0" font-family="Libre Baskerville" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#1B2A4A">academics, about an hour a term</text><text x="120.0" y="1160.0" font-family="Libre Baskerville" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">Solid boxes are roles; dashed boxes are bodies or pools. Every role is unpaid.</text></svg>