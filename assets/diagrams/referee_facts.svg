<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="500" viewBox="0 0 2480 500"><rect x="0" y="0" width="2480.0" height="500.0" fill="#F6F2EA"/><g transform="translate(60 30)"><line x1="0.0" y1="10" x2="560.0" y2="10" stroke="#B08D57" stroke-width="3"/><text x="0.0" y="200.0" font-family="Libre Baskerville" font-size="150" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1B2A4A">60</text><text x="0.0" y="265.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="start" letter-spacing="4" fill="#1B2A4A">MINUTES</text><text x="0.0" y="330.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">a report is designed to take about</text><text x="0.0" y="364.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">an hour, ninety at most</text><line x1="600.0" y1="10" x2="1160.0" y2="10" stroke="#B08D57" stroke-width="3"/><text x="600.0" y="200.0" font-family="Libre Baskerville" font-size="150" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1B2A4A">2</text><text x="600.0" y="265.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="start" letter-spacing="4" fill="#1B2A4A">REPORTS A TERM</text><text x="600.0" y="330.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">the most anyone in the pool is</text><text x="600.0" y="364.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">asked for</text><line x1="1200.0" y1="10" x2="1760.0" y2="10" stroke="#B08D57" stroke-width="3"/><text x="1200.0" y="200.0" font-family="Libre Baskerville" font-size="150" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1B2A4A">21</text><text x="1200.0" y="265.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="start" letter-spacing="4" fill="#1B2A4A">DAYS</text><text x="1200.0" y="330.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">from accepting an invitation to the</text><text x="1200.0" y="364.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">report</text><line x1="1800.0" y1="10" x2="2360.0" y2="10" stroke="#B08D57" stroke-width="3"/><text x="1800.0" y="200.0" font-family="Libre Baskerville" font-size="150" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1B2A4A">0</text><text x="1800.0" y="265.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="start" letter-spacing="4" fill="#1B2A4A">NAMES SHOWN</text><text x="1800.0" y="330.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">anonymised in both directions</text></g></svg>