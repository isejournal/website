<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2000" viewBox="0 0 1080 2000"><rect x="0" y="0" width="1080.0" height="2000.0" fill="#F6F2EA"/><text x="80.0" y="120.0" font-family="Libre Baskerville" font-size="26" font-weight="400" text-anchor="start" letter-spacing="4" fill="#7B633D">HOW A PAPER IS REVIEWED</text><text x="80.0" y="190.0" font-family="Libre Baskerville" font-size="50" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1B2A4A">Ten stops; decision within eight weeks</text><line x1="160.0" y1="300.0" x2="160.0" y2="1785.0" stroke="#1B2A4A" stroke-width="3"/><circle cx="160.0" cy="300.0" r="12" fill="#F6F2EA" stroke="#1B2A4A" stroke-width="3"/><text x="110.0" y="309.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="end" letter-spacing="2" fill="#7B633D">01</text><text x="210.0" y="304.0" font-family="Libre Baskerville" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1B2A4A">Submission</text><text x="210.0" y="350.0" font-family="Libre Baskerville" font-size="28" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">open all year from 12 October</text><circle cx="160.0" cy="465.0" r="12" fill="#F6F2EA" stroke="#1B2A4A" stroke-width="3"/><text x="110.0" y="474.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="end" letter-spacing="2" fill="#7B633D">02</text><text x="210.0" y="469.0" font-family="Libre Baskerville" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1B2A4A">Screening</text><text x="210.0" y="515.0" font-family="Libre Baskerville" font-size="28" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">anonymised in 5 working days</text><circle cx="160.0" cy="630.0" r="12" fill="#F6F2EA" stroke="#1B2A4A" stroke-width="3"/><text x="110.0" y="639.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="end" letter-spacing="2" fill="#7B633D">03<