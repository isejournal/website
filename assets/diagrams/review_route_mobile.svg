eight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">Chief Editor</text><circle cx="160.0" cy="1290.0" r="12" fill="#F6F2EA" stroke="#1B2A4A" stroke-width="3"/><text x="110.0" y="1299.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="end" letter-spacing="2" fill="#7B633D">07</text><text x="210.0" y="1294.0" font-family="Libre Baskerville" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1B2A4A">Revision</text><text x="210.0" y="1340.0" font-family="Libre Baskerville" font-size="28" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">minor 14 days · major 28</text><circle cx="160.0" cy="1455.0" r="12" fill="#F6F2EA" stroke="#1B2A4A" stroke-width="3"/><text x="110.0" y="1464.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="end" letter-spacing="2" fill="#7B633D">08</text><text x="210.0" y="1459.0" font-family="Libre Baskerville" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1B2A4A">Data and code</text><text x="210.0" y="1505.0" font-family="Libre Baskerville" font-size="28" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">methods desk check</text><circle cx="160.0" cy="1620.0" r="12" fill="#F6F2EA" stroke="#1B2A4A" stroke-width="3"/><text x="110.0" y="1629.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="end" letter-spacing="2" fill="#7B633D">09</text><text x="210.0" y="1624.0" font-family="Libre Baskerville" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1B2A4A">Production</text><text x="210.0" y="1670.0" font-family="Libre Baskerville" font-size="28" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">typeset and proofed</text><circle cx="160.0" cy="1785.0" r="16" fill="#B08D57" stroke="#B08D57" stroke-width="3"/><text x="110.0" y="1794.0" font-family="Libre Baskerville" font-size="24" font-weight="400" text-anchor="end" letter-spacing="2" fill="#7B633D">10</text><text x="210.0" y="1789.0" font-family="Libre Baskerville" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1B2A4A">Published</text><text x="210.0" y="1835.0" font-family="Libre Baskerville" font-size="28" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1B2A4A">two issues a year</text></svg>